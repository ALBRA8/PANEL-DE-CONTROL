# ALBRA — Imagen OCI del PANEL DE CONTROL para GHCR.
#
# Produce ghcr.io/albra8/panel-de-control:<version> — el ref exacto que el
# catálogo del INSTALADOR fija por digest (PANEL_DEPLOYMENT_SOURCE.images).
# El digest inmutable resultante es lo que el INSTALADOR ancla (pinImageDigest).
#
# Disparo:
#   - push de tag image-vX.Y.Z   → construye y publica X.Y.Z
#   - workflow_dispatch          → input version (default 1.0.0)
#
# NOTA de visibilidad: el paquete GHCR nace PRIVADO. Para que el INSTALADOR
# pueda hacer docker pull sin credenciales en el equipo de despliegue, hazlo
# público en GitHub → Packages → panel-de-control → Package settings →
# Change visibility → Public (o docker login ghcr.io en el equipo).
name: build-image

on:
  push:
    tags: ["image-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semver a publicar (coincide con el catálogo del INSTALADOR)"
        required: true
        default: "1.0.0"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/albra8/panel-de-control

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolver versión
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#image-v}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publicando $IMAGE:$v"

      - name: "Build & push (multi-tag: versión y sha del commit)"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=ALBRA Panel de Control
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Digest inmutable (para el pinning del INSTALADOR)
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:${{ steps.ver.outputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "### Imagen publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "imagen:  $IMAGE:${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest:  sha256:$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "El INSTALADOR ancla este digest en \`ContainerDeployment.imageDigests\` antes del \`compose up\`." >> "$GITHUB_STEP_SUMMARY"
